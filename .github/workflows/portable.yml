name: Linux and macOS packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (empty uses Directory.Build.props)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          # theOdrop ships for macOS and Windows only (Windows is built by release.yml).
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libc6 libgcc-s1 libgssapi-krb5-2 libicu74 libssl3t64 libstdc++6 tzdata zlib1g \
            libfontconfig1 libfreetype6 libx11-6 libice6 libsm6 libxrandr2 libxkbcommon0 libxi6 libxtst6 xvfb fonts-noto-cjk

      - name: Fonts
        run: ./build/fetch-fonts.ps1

      - name: Restore engine downloads
        uses: actions/cache@v4
        with:
          path: build/.cache/portable-downloads
          key: portable-engines-${{ matrix.rid }}-${{ hashFiles('src/Filee.Engines/Infrastructure/engines.json') }}

      - name: Build and test native projects
        run: |
          ./build/fetch-portable-engines.ps1 -Runtime '${{ matrix.rid }}' -Destination engines
          dotnet build Filee.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projects = @('Filee.Core.Tests', 'Filee.Platform.Tests', 'Filee.Engines.Tests', 'Filee.Cli.Tests', 'Filee.App.Tests')
          foreach ($project in $projects) {
            $testArguments = @('test', "tests/$project/$project.csproj", '--no-build', '-c', 'Release', '--logger', 'trx', '--results-directory', "TestResults/${{ matrix.rid }}",
              '--filter', 'FullyQualifiedName!=Filee.App.Tests.ExplorerMenuTests.Every_native_import_exists_in_the_dll_it_names&FullyQualifiedName!=Filee.App.Tests.ExplorerMenuTests.Reading_the_registered_package_never_throws')
            if ($IsLinux) {
              xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 dotnet @testArguments
            } else {
              dotnet @testArguments
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build portable package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./build/build-portable.ps1 -Runtime '${{ matrix.rid }}' -Version $env:PACKAGE_VERSION -SkipFonts

      - name: Check archive and run native converters
        run: |
          $archives = @(Get-ChildItem Releases -Filter '*-${{ matrix.rid }}.tar.gz')
          if ($archives.Count -ne 1) { throw 'Expected one portable archive.' }
          $archive = $archives[0]
          $expected = (Get-Content (Join-Path Releases ($archive.Name.Replace('.tar.gz', '-SHA256SUMS.txt')))).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expected) { throw 'Archive checksum mismatch.' }
          $smoke = Join-Path $env:RUNNER_TEMP 'filee-smoke'
          New-Item -ItemType Directory -Path $smoke | Out-Null
          tar -xzf $archive.FullName -C $smoke
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed.' }
          $package = Join-Path $smoke ($archive.Name.Replace('.tar.gz', ''))
          if ($IsMacOS) {
            codesign --verify --deep --strict (Join-Path $package 'theOdrop.app')
            if ($LASTEXITCODE -ne 0) { throw 'Extracted app signature did not verify.' }
          }
          $bin = if ($IsMacOS) { Join-Path $package 'theOdrop.app/Contents/MacOS' } else { $package }
          $cli = Join-Path $bin 'filee-cli'
          & $cli version
          if ($LASTEXITCODE -ne 0) { throw 'CLI did not start.' }
          & (Join-Path $bin 'engines/rhwp/rhwp') --version
          if ($LASTEXITCODE -ne 0) { throw 'rhwp did not start.' }
          & (Join-Path $bin 'engines/7zip/7zz') i | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7-Zip did not start.' }
          $inputFile = Join-Path $smoke 'sample.txt'
          'Filee 한글 conversion smoke test' | Set-Content $inputFile -Encoding utf8NoBOM
          & $cli convert $inputFile --to hwpx -o (Join-Path $smoke 'converted') --json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $smoke 'converted/sample.hwpx'))) { throw 'Published CLI conversion failed.' }
          "FILEE_SMOKE_APP=$(Join-Path $bin 'Filee')" >> $env:GITHUB_ENV

      # Every tool of the ⌘ ring and the common conversions, run through the packaged app's CLI (same engine and presets
      # as the app). Any that fails or writes nothing fails the build, with a summary of all of them.
      - name: End-to-end tools and conversions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          app="$(ls -d "$RUNNER_TEMP"/filee-smoke/*/theOdrop.app | head -1)"
          cli="$app/Contents/MacOS/filee-cli"
          w="$RUNNER_TEMP/e2e"; rm -rf "$w"; mkdir -p "$w/in"; cd "$w"
          python3 - in <<'PY'
          import struct, sys, zlib
          def png(path, w, h, seed):
              rows = b"".join(b"\x00" + bytes(((x * 4 + seed) % 256, (y * 5) % 256, (x + y + seed * 3) % 256) for x in range(w)) for y in range(h))
              chunk = lambda t, d: struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                                     + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
          png(f"{sys.argv[1]}/photo.png", 96, 64, 1)
          png(f"{sys.argv[1]}/photo2.png", 80, 60, 7)
          PY
          printf 'theOdrop 한글 end-to-end test\nsecond line\n' > in/note.txt
          "$cli" convert in/photo.png --to jpg -o in --quiet
          "$cli" convert in/photo.png in/photo2.png --to pdf -o in --quiet
          (cd in && zip -q archive.zip photo.png note.txt)
          ls -la in
          failed=0
          run() {
            local name="$1"; shift
            local out="out/$name"; mkdir -p "$out"
            if "$cli" convert "$@" -o "$out" --quiet > "out/$name.log" 2>&1 && [ -n "$(find "$out" -type f | head -1)" ]; then
              echo "OK   $name: $(cd "$out" && find . -type f | sed 's#^\./##' | tr '\n' ' ')"
            else
              failed=$((failed + 1)); echo "FAIL $name"; sed 's/^/     /' "out/$name.log"
            fi
          }
          run half-size          in/photo.jpg --preset half-size
          run grayscale          in/photo.jpg --preset grayscale
          run remove-background  in/photo.png --preset remove-background
          run rotate-left        in/photo.jpg --preset rotate-left
          run rotate-right       in/photo.jpg --preset rotate-right
          run rotate-180         in/photo.jpg --preset rotate-180
          run flip-horizontal    in/photo.jpg --preset flip-horizontal
          run flip-vertical      in/photo.jpg --preset flip-vertical
          run pdf-long-image     in/photo.pdf --preset pdf-long-image
          run pdf-split          in/photo.pdf --preset pdf-split
          run merge-pdf          in/photo.pdf in/photo2.pdf --preset merge-pdf
          run zip-all            in/photo.png in/note.txt --preset zip-all
          run extract            in/archive.zip --preset extract
          for format in jpg webp avif heic gif tiff bmp ico pdf; do run "png-to-$format" in/photo.png --to "$format"; done
          for format in docx hwpx pdf odt; do run "txt-to-$format" in/note.txt --to "$format"; done
          if [ "$failed" -gt 0 ]; then echo "$failed check(s) failed"; exit 1; fi
          echo "All end-to-end checks passed"

      # The downloadable engines (calibre, Pandoc, LibreOffice on macOS) installed the way the app's Engines page does,
      # then run once: a moved download or a changed disk image fails here instead of in the app.
      - name: Install and run downloadable engines
        if: runner.os == 'macOS'
        shell: bash
        env:
          THEODROP_INSTALL_ENGINES: '1'
        run: |
          dotnet test tests/Filee.Engines.Tests/Filee.Engines.Tests.csproj --no-build -c Release \
            --filter "FullyQualifiedName~EngineInstallTests" --logger "console;verbosity=normal"

      # Drag-to-install disk image: theOdrop.app, a shortcut to Applications and how to open it the first time
      # (the build is ad-hoc signed, not notarized). Its hash goes into the package's checksum file.
      - name: Build disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls Releases/*-${{ matrix.rid }}.tar.gz)"
          name="$(basename "$archive" .tar.gz)"
          source="$RUNNER_TEMP/dmg-source"
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$source" "$stage"
          mkdir -p "$source" "$stage"
          tar -xzf "$archive" -C "$source"
          ditto "$source/$name/theOdrop.app" "$stage/theOdrop.app"
          codesign --verify --deep --strict "$stage/theOdrop.app"
          ln -s /Applications "$stage/Applications"
          cp installer/macos/FIRST-OPEN.txt "$stage/처음 실행 방법 (How to open).txt"
          # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy" (a known runner issue): retry.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "theOdrop" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "Releases/$name.dmg"; then
              break
            fi
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          hdiutil verify "Releases/$name.dmg"
          (cd Releases && shasum -a 256 "$name.dmg" >> "$name-SHA256SUMS.txt")
          cat "Releases/$name-SHA256SUMS.txt"

      - name: Launch native desktop app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import signal
          import subprocess
          import sys
          import time

          app = os.environ['FILEE_SMOKE_APP']
          shots = pathlib.Path(os.environ['RUNNER_TEMP']) / 'filee-screens'
          shots.mkdir(exist_ok=True)
          command = [app, '--settings', '--install-engines=', '--context-menu=off', '--start-with-system=off']
          if os.environ['RUNNER_OS'] == 'Linux':
              command = ['xvfb-run', '-a', 'env', '-u', 'WAYLAND_DISPLAY', 'XDG_SESSION_TYPE=x11', *command]
          log_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'filee-startup.log'
          with log_path.open('w') as log:
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  time.sleep(8)
                  if process.poll() is not None:
                      raise RuntimeError('The desktop app exited before the startup check.')
                  if os.environ['RUNNER_OS'] == 'macOS':
                      # The real screen with Filee's window, as a person would see it (uploaded with the results).
                      subprocess.run(['screencapture', '-x', str(shots / 'settings.png')], check=False, timeout=30)
                      # A second start forwards to the running Filee, which brings its window to the front.
                      try:
                          subprocess.run([app], check=False, timeout=30)
                      except subprocess.TimeoutExpired:
                          raise RuntimeError('A second start did not hand over to the running Filee.')
                      time.sleep(4)
                      subprocess.run(['screencapture', '-x', str(shots / 'second-start.png')], check=False, timeout=30)
                      if process.poll() is not None:
                          raise RuntimeError('The desktop app exited after a second start.')
                  quit_code = 'import os, sys; os.setsid(); os.execv(sys.argv[1], [sys.argv[1], "--quit"])'
                  # Reap Filee as soon as it ends while --quit waits for it, as launchd or a shell would: a process
                  # that has ended but was not reaped by its parent (this script) still counts as running.
                  quitter = subprocess.Popen([sys.executable, '-c', quit_code, app])
                  quit_deadline = time.monotonic() + 30
                  while quitter.poll() is None:
                      process.poll()
                      if time.monotonic() > quit_deadline:
                          quitter.kill()
                          raise RuntimeError('filee --quit did not finish.')
                      time.sleep(0.05)
                  if quitter.returncode != 0:
                      raise RuntimeError(f'filee --quit exited with {quitter.returncode}.')
                  if process.wait(timeout=15) != 0:
                      raise RuntimeError('The desktop app did not exit cleanly.')
              except BaseException:
                  log.flush()
                  print(log_path.read_text(errors='replace'), file=sys.stderr)
                  raise
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
          PY

      - name: Collect Filee logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/filee-screens"
          for logs in "$HOME/Library/Application Support/Filee/logs" "$HOME/.config/Filee/logs"; do
            if [ -d "$logs" ]; then cp -R "$logs" "$RUNNER_TEMP/filee-screens/"; fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.rid }}
          path: |
            Releases/*-${{ matrix.rid }}.tar.gz
            Releases/*-${{ matrix.rid }}.dmg
            Releases/*-${{ matrix.rid }}-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unix-test-results-${{ matrix.rid }}
          path: |
            TestResults/${{ matrix.rid }}/
            tests/Filee.App.Tests/bin/Release/net10.0/screenshots/
            ${{ runner.temp }}/filee-startup.log
            ${{ runner.temp }}/filee-screens/
          if-no-files-found: ignore
